name: Build Windows Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build app with PyInstaller
        run: pyinstaller pc_cleaner.spec --noconfirm

      - name: Verify build output
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\Bismark PC Cleaner\Bismark PC Cleaner.exe")) {
            throw "Build failed: dist\Bismark PC Cleaner\Bismark PC Cleaner.exe not found"
          }
          Get-ChildItem "dist\Bismark PC Cleaner" | Select-Object Name, Length

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag.TrimStart("v")
          if ([string]::IsNullOrWhiteSpace($ver)) { $ver = "1.0.0" }
          Write-Output "Building installer version $ver"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" "installer\setup.iss"
          Get-ChildItem "installer-output\Bismark-PC-Cleaner-Setup.exe" | Select-Object Name, Length

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bismark-PC-Cleaner-Setup
          path: installer-output/Bismark-PC-Cleaner-Setup.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: installer-output/Bismark-PC-Cleaner-Setup.exe
          generate_release_notes: true
